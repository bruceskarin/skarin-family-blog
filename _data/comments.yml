happy-2nd-birthday:
- author: Bruce Kaylor
  date: May 16, 2012
  body: Happy Birthday indeed. You have a wonderful and loving Mom Evan. I hope you
    enjoy all these notes and memories from your childhood and that they help to remind
    you what being alive is all about... learning and loving.<br /><br />It was never
    put to me that plainly and perhaps it&#39;s just something you have to learn along
    with everything else, but if you can remember how little you started with and
    how it&#39;s grown and flourished, you can live a life without limits.<br /><br
    />Sometimes as parents we get too lost in all the &quot;stuff&quot; that consumes
    valuable time and energy. Some of it is necessary, but more often it&#39;s just
    a choice. Having a son like you has helped reconnect us to what matters, and for
    that we thank you. With you we once again see the infinite capacity to love and
    learn like a child. I love you Son.<br /><br />Love Always,<br />Dad
